[versions]
#plugins versions
agp = "9.2.1"
kotlin = "2.3.21"
dokka = "2.2.0"

#dependencies versions
appcompat = "1.7.1"
constraintlayout = "2.2.1"
coroutines = "1.11.0"
ktor = "3.5.1"
# speculor-app's fork, not upstream: it carries the RTCP capture-time patches
# this server depends on, and now the SdpBody fps parameter used to declare
# a=framerate. Upstream has neither, so building against it would not compile.
rootEncoder = "2.8.0-spc.16"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
rootEncoder-library = { module = "com.github.speculor-app.RootEncoder:library", version.ref = "rootEncoder" }
rootEncoder-extra-sources = { module = "com.github.speculor-app.RootEncoder:extra-sources", version.ref = "rootEncoder" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }